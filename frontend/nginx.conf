# Ten TOTP checks per minute per client address, with a small burst for typos.
limit_req_zone $binary_remote_addr zone=totp_verify:10m rate=10r/m;

server {
  listen 80;
  server_name _;

  location = /api/auth/verify {
    limit_req zone=totp_verify burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://auth-service:8080/api/auth/verify;
  }

  location /api/auth/ {
    proxy_pass http://auth-service:8080/api/auth/;
  }

  # Settlement is called by trade-service inside the cluster only; never route it from outside.
  location /api/wallet/internal/ {
    return 404;
  }

  location /api/wallet/ {
    proxy_pass http://wallet-service:8081/api/wallet/;
  }

  location /api/trade/ {
    proxy_pass http://trade-service:8082/api/trade/;
  }

  location /ws {
    proxy_pass http://trade-service:8082;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }
}
