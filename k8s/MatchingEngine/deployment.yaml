apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: matching-engine
  namespace: resource-lane
spec:
  serviceName: matching-engine
  replicas: 1
  selector:
    matchLabels:
      app: matching-engine
  template:
    metadata:
      labels:
        app: matching-engine
    spec:
      containers:
        - name: matching-engine
          image: resourcelane/matching-engine:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BROKER
              value: kafka:9092
            - name: MATCHER_STATE_FILE
              value: /var/lib/resourcelane/state.json
          volumeMounts:
            - name: matcher-state
              mountPath: /var/lib/resourcelane
      volumes:
        - name: matcher-state
          persistentVolumeClaim:
            claimName: matching-engine-state
