apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  namespace: resource-lane
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-topics
          image: confluentinc/cp-kafka:7.6.0
          imagePullPolicy: Never
          command:
            - bash
            - -ec
            - |
              until kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
                sleep 3
              done
              # One partition for the single-book topics keeps them in production order.
              for entry in order:1 trade:1 ltp:1 orderbook:1 status:3 trade.DLT:1 status.DLT:1; do
                kafka-topics --bootstrap-server kafka:9092 \
                  --create --if-not-exists --replication-factor 1 \
                  --partitions "${entry#*:}" --topic "${entry%%:*}"
              done
