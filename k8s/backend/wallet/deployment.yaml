apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-service
  namespace: resource-lane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wallet-service
  template:
    metadata:
      labels:
        app: wallet-service
    spec:
      containers:
        - name: wallet-service
          image: resourcelane/wallet-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: resource-lane-secrets
                  key: JWT_SECRET
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resource-lane-secrets
                  key: DB_PASSWORD
            - name: INTERNAL_SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: resource-lane-secrets
                  key: INTERNAL_SECRET_TOKEN
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 10
            failureThreshold: 18
