apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-service
  namespace: resource-lane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trade-service
  template:
    metadata:
      labels:
        app: trade-service
    spec:
      containers:
        - name: trade-service
          image: resourcelane/trade-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: resource-lane-secrets
                  key: JWT_SECRET
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resource-lane-secrets
                  key: DB_PASSWORD
            - name: INTERNAL_SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: resource-lane-secrets
                  key: INTERNAL_SECRET_TOKEN
            - name: KAFKA_BROKER
              value: kafka:9092
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            periodSeconds: 10
            failureThreshold: 18
