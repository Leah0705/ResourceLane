apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: resource-lane
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: auth-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["auth-service:8080"]
      - job_name: wallet-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["wallet-service:8081"]
      - job_name: trade-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["trade-service:8082"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: resource-lane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.14.0
          imagePullPolicy: Never
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1d
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: resource-lane
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
