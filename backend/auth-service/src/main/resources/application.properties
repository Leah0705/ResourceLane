spring.application.name=auth-service
jwt.secret=${JWT_SECRET}

# database configuration
# spring.datasource.url=jdbc:postgresql://localhost:5432/resourcelane
# FOR DOCKER
spring.datasource.url=jdbc:postgresql://postgres-db:5432/resourcelane
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# wallet.service.url=http://localhost:8081/api/wallet/createWallet

wallet.service.url=http://wallet-service:8081/api/wallet/createWallet

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always

server.port=8080
